  Release:
    runs-on: ubuntu-latest
    needs: [ Setup, VirusScan, SecurityScan ]
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Show Artifacts
        run: |
          echo -e "Directory Listing:\n$(ls -1Ssh ${{ vars.COLLECTOR }}-*.*)"
          echo -e "\nDirectory Size:\n$(du -chd0 ${{ vars.COLLECTOR }}-*.*)"
          echo -e "\nISO and TGZ files:"
          ls -1Ssh *tgz* *iso* || echo "No ISO/TGZ files found"
          echo ""
          echo "Virus scan report:"
          ls -1Ssh *virus-scan-report* || echo "No virus scan report found"

      - name: Set up Git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Create tag
        uses: rickstaa/action-create-tag@v1
        id: tag_create
        with:
          tag: ${{ needs.Setup.outputs.Date }}
          github_token: ${{secrets.GITHUB_TOKEN}}
          tag_exists_error: false
          message: "Release for ${{ needs.Setup.outputs.Date }} run"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ vars.COLLECTOR }} ${{ needs.Setup.outputs.Date }}
          tag_name: ${{ needs.Setup.outputs.Date }}
          make_latest: true
          files: ${{ vars.COLLECTOR }}-*.*

  Sharepoint:
    runs-on: ubuntu-latest
    needs: [ Setup, VirusScan, SecurityScan ]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Show Artifacts
        run: |
          echo -e "Directory Listing:\n$(ls -1Ssh ${{ vars.COLLECTOR }}-*.*)"
          echo -e "\nDirectory Size:\n$(du -chd0 ${{ vars.COLLECTOR }}-*.*)"
          echo -e "\nISO and TGZ files:"
          ls -1Ssh *tgz* *iso* || echo "No ISO/TGZ files found"
          echo ""
          echo "Virus scan report:"
          ls -1Ssh *virus-scan-report* || echo "No virus scan report found"
