# Branch validation for Collector-Python-Pip
#
# This workflow validates the collector itself. It does not collect and publish
# third-party Python packages or upload anything to Nexus. Those operations
# belong in release/collection workflows with explicit credentials and approval.

name: Branch Validation

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: branch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_RUNTIME_CONFIG: python-runtimes.json
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "0"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  runtime-matrix:
    name: Read configured Python versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python-versions: ${{ steps.versions.outputs.python-versions }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read Python series from runtime configuration
        id: versions
        run: |
          set -euo pipefail
          jq -e '
            [.source_versions, .windows_versions] | all(.[];
              type == "array" and length > 0 and all(.[];
                type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$")
              )
            )
          ' "$PYTHON_RUNTIME_CONFIG" > /dev/null
          versions=$(jq -c '
            [.source_versions[], .windows_versions[]]
            | map(split(".")[:2] | join(".")) | unique
          ' "$PYTHON_RUNTIME_CONFIG")
          echo "python-versions=$versions" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate on Python ${{ matrix.python-version }}
    needs: runtime-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.runtime-matrix.outputs.python-versions) }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python runtime
        run: |
          set -euo pipefail
          python --version
          python - "${{ matrix.python-version }}" <<'PY'
          import sys

          expected = tuple(map(int, sys.argv[1].split(".")))
          assert sys.version_info[:2] == expected
          PY

      - name: Check shell scripts
        run: |
          set -euo pipefail
          bash -n collect.sh kickstart.sh setup.sh upload.sh

      - name: Test runtime version updater
        run: python -m unittest discover -s tests -v
