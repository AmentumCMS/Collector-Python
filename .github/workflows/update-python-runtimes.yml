name: Update Python runtime versions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-python-runtimes-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_RUNTIME_CONFIG: python-runtimes.json

jobs:
  update:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Discover latest published runtime artifacts
        run: python scripts/update_python_runtimes.py "$PYTHON_RUNTIME_CONFIG"

      - name: Commit updated configuration
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$PYTHON_RUNTIME_CONFIG"; then
            echo "Runtime versions are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PYTHON_RUNTIME_CONFIG"
          git commit -m "Update Python runtime versions"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
