  Release:
    runs-on: ubuntu-latest
    needs: [ Setup, VirusScan, SecurityScan ]
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Show Artifacts
        run: |
          echo -e "Directory Listing:\n$(ls -1Ssh ${{ vars.COLLECTOR }}-*.*)"
          echo -e "\nDirectory Size:\n$(du -chd0 ${{ vars.COLLECTOR }}-*.*)"
          echo -e "\nISO and TGZ files:"
          ls -1Ssh *tgz* *iso* || echo "No ISO/TGZ files found"
          echo ""
          echo "Virus scan report:"
          ls -1Ssh *virus-scan-report* || echo "No virus scan report found"

  Sharepoint:
    runs-on: ubuntu-latest
    needs: [ Setup, VirusScan, SecurityScan ]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Show Artifacts
        run: |
          echo -e "Directory Listing:\n$(ls -1Ssh ${{ vars.COLLECTOR }}-*.*)"
          echo -e "\nDirectory Size:\n$(du -chd0 ${{ vars.COLLECTOR }}-*.*)"
          echo -e "\nISO and TGZ files:"
          ls -1Ssh *tgz* *iso* || echo "No ISO/TGZ files found"
          echo ""
          echo "Virus scan report:"
          ls -1Ssh *virus-scan-report* || echo "No virus scan report found"
